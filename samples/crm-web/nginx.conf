# What serves the client, and what it refuses to do.
#
# The API is reached through this server rather than directly from the browser, so the two are
# one origin: no CORS in the path, no preflight on every write, and no list of allowed origins to
# keep in step with a deployment. `FLOWX_CORS_ORIGINS` stays empty in this arrangement, which is
# the safest value it has.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The version is a fingerprint, and a fingerprint is the first thing a scanner reads.
    server_tokens off;

    # ------------------------------------------------------------------ what a browser may do

    # A page that loads nothing from anywhere else. This client's bundle, styles and fonts are
    # its own — every rule below is `self` because there is genuinely nothing external, which is
    # the only condition under which a strict policy survives contact with a real deployment.
    #
    # `connect-src 'self'` is what makes the proxy below load-bearing: a client that called the
    # API on another origin would need that origin here, and the policy would be one host wider
    # for every environment.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # No camera, no microphone, no geolocation. A CRM asks for none of them, and saying so is
    # what stops a dependency asking on its behalf.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ------------------------------------------------------------------ the API

    # Same origin, so the browser sends the bearer token without a preflight and the API needs
    # no CORS policy at all.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # THE UPSTREAM'S OWN NAME, NOT THE ONE THE CLIENT ASKED FOR. This read `Host $host`,
        # and `$host` is the request's `Host` header — with `server_name _` above accepting
        # every name, that is a value the caller chooses. Forwarding it hands the API an
        # attacker-controlled host: the shape behind reset links that point at another domain,
        # cache entries keyed on one host and served for another, and routing decisions made
        # on a header. `$proxy_host` is `api:8080`, from the `proxy_pass` line, and is nginx's
        # own default for this header — the override was what introduced the exposure.
        #
        # Nothing needed it: no `Request.Host`, no `UseForwardedHeaders`, no absolute-URL
        # building anywhere in samples/crm, src or plugins. If something ever does, the answer
        # is a `server_name` allowlist plus a default server that refuses the rest, so that
        # `$host` is a checked value before it is passed on — not this line coming back.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API answers a write in well under this; a longer read timeout turns a hung
        # upstream into a hung browser tab.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ------------------------------------------------------------------ the assets

    # Content-hashed by the bundler, so they can be cached until the heat death of the universe
    # and a deploy invalidates them by changing the name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # A client-side router owns every other path: the server hands back the shell and the router
    # decides. Without this, a reload on /records/account is a 404 from nginx and looks like the
    # application being broken.
    location / {
        try_files $uri $uri/ /index.html;

        # The shell itself is never cached: it is the file naming the hashed bundles, and a stale
        # copy points at assets a deploy has already removed.
        add_header Cache-Control "no-store" always;
    }

    # Dot-files are configuration, editor droppings and version control. None of them is content.
    location ~ /\. {
        deny all;
    }
}
