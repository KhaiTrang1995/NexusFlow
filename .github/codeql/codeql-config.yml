# CodeQL scans what the build compiles, and this build compiles 638 generated files.
#
# Directory.Build.props sets EmitCompilerGeneratedFiles, so every source generator's output
# lands under obj/generated and is extracted like hand-written source: System.Text.Json's
# serialisers, FlowX's own plans and dispatchers, the regex generator's matchers. An alert
# raised against a file nobody wrote is not a finding — nobody can act on it, and it cannot
# be fixed without changing a generator that emits the same shape on purpose.
#
# This is the argument coverlet.runsettings already makes for coverage, applied to the same
# files for the same reason: a number measured over generated code is not a smaller number,
# it is a different one.
#
# What this does NOT exclude: the generators themselves. src/FlowX.Compiler is hand-written
# and stays in scope, which is where a defect in emitted code would actually originate.

name: FlowX

paths-ignore:
  - '**/obj/**'
  - '**/bin/**'
