version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    # A compromised release is usually yanked within days of being published, so a
    # week's wait is the difference between inheriting it and reading about it. This
    # governs version updates only; a Dependabot security update still arrives at once.
    cooldown:
      default-days: 7
    # Grouped so a weekly bump is one reviewable PR rather than eleven. Security
    # updates are deliberately left ungrouped so they can merge on their own.
    groups:
      test-dependencies:
        patterns: ['xunit*', 'Shouldly', 'Microsoft.NET.Test.Sdk', 'coverlet*']
      analyzers:
        patterns: ['*.Analyzers', 'SonarAnalyzer*', 'StyleCop*']

  # The client's lockfile was never bumped by anything. `nuget` and `github-actions`
  # below have been here throughout; `samples/crm-web` has 348 packages and no policy,
  # so its transitive tree only moved when somebody happened to reinstall. The audit
  # gate in security.yml names five dev advisories it cannot yet clear — this is what
  # eventually clears them, by moving the tree those advisories sit in.
  - package-ecosystem: npm
    directory: /samples/crm-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    cooldown:
      default-days: 7
    # One reviewable PR per concern rather than one per package: the toolchain moves
    # together, and React and its types are a single upgrade in practice.
    groups:
      client-toolchain:
        patterns: ['vite', '@vitejs/*', 'vitest', '@vitest/*', 'typescript', 'eslint*', 'typescript-eslint', '@playwright/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tanstack:
        patterns: ['@tanstack/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
    # Actions are pinned by major tag; this catches the ones that go stale
    # silently, which is how a supply-chain issue reaches a build (OWASP A08).
    cooldown:
      default-days: 7
