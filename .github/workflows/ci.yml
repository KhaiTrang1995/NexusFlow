name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FlowX.slnx

      - name: Build
        # Directory.Build.props sets TreatWarningsAsErrors — a warning nobody fixes
        # is a warning that hides the next one.
        run: dotnet build FlowX.slnx --configuration Release --no-restore

      - name: Restore the projects that are not in the solution
        # This exists for exactly one gate, and it does not implement it.
        #
        # DependencyLicencesAreCompatible (constraint C6, ADR-0012) vets the *resolved*
        # transitive dependency graph, which NuGet writes to obj/project.assets.json —
        # so it needs no network and no licence API, but it does need a restore to have
        # happened. `dotnet restore FlowX.slnx` above covers every project in the
        # solution. scripts/generator-cost-probe is deliberately outside it (a
        # measurement harness, not a build target), so nothing restores it and its
        # closure would go unread. One line here, and CI vets it too.
        #
        # This is NOT a second implementation of the licence rule. There is one, it is
        # the fitness function, and this repository has already deleted a shell copy of
        # a rule that had a test — see the `debt` job in quality.yml and docs/DEBT.md:
        # two gates for one rule disagree eventually, and the weaker one is what a
        # developer meets first. This step widens the gate's input and decides nothing.
        #
        # templates/FlowX.Templates/content/FlowX.Web is deliberately absent: it
        # references FlowX.* packages by version, and until WP-70 publishes them there
        # is no feed to restore from. Its declared references are still checked, and
        # docs/DEPENDENCIES.md §5 records that its closure is not. Add it here when
        # WP-70 lands.
        run: dotnet restore scripts/generator-cost-probe/GeneratorCostProbe.csproj

      - name: Architecture fitness functions
        # docs/05-Architecture.md §12. A red fitness function is a build failure,
        # not a discussion — so this step runs before the rest of the suite.
        run: dotnet test tests/FlowX.Architecture.Tests --configuration Release --no-build --logger "console;verbosity=detailed"

      - name: Unit and integration tests
        run: >
          dotnet test FlowX.slnx --configuration Release --no-build
          --filter "FullyQualifiedName!~Architecture"
          --collect:"XPlat Code Coverage"

  template:
    name: dotnet new flowx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: The template generates a project that builds clean and serves a request
        # templates/README.md called this "the acceptance test, and what CI should run",
        # and until now nothing ran it — so `dotnet new flowx` was verified by whoever
        # last remembered to, which is the definition of a gate that does not exist.
        #
        # Its own job, not a step in `build`, for two reasons. It is not about the
        # solution: the template pack is deliberately outside FlowX.slnx, and the thing
        # under test is `dotnet new`, `dotnet restore` against a feed, and a process
        # listening on a socket. And it is machine-global — it registers a NuGet source
        # and installs a template — which is fine on a throwaway runner and is not
        # something to do halfway through the test job.
        #
        # The script packs the seven packages a generated project resolves, evicting
        # them from the NuGet cache first: the version does not change between runs, and
        # NuGet caches by id AND version, so without the eviction a second run verifies
        # the first run's assemblies and reports green against stale output.
        run: templates/verify.sh

  aot:
    name: NativeAOT smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Trim and AOT analyzers must be clean
        # Constraint C2. For libraries the real gate is the analyzer, which
        # Directory.Build.props enables on everything under src/ via
        # IsAotCompatible. A reflection call that would break trimming surfaces
        # here as an IL2xxx/IL3xxx error at build time, not at publish time.
        run: |
          dotnet build FlowX.slnx --configuration Release 2>&1 | tee build.log
          if grep -qE 'IL2[0-9]{3}|IL3[0-9]{3}'  build.log; then
            echo "::error::Trim or AOT warnings found — constraint C2 forbids them."
            exit 1
          fi

      - name: NativeAOT publish
        # The reference sample is the executable that makes constraint C2 checkable:
        # PublishAot is a no-op on a class library, so until WP-10 this step had
        # nothing to publish and said so rather than passing vacuously.
        run: |
          dotnet publish samples/ecommerce/Ecommerce.csproj --configuration Release \
            --runtime linux-x64 --self-contained /p:PublishAot=true \
            /p:TrimmerSingleWarn=false 2>&1 | tee aot.log
          if grep -qE 'IL2[0-9]{3}|IL3[0-9]{3}' aot.log; then
            echo "::error::Trim or AOT warnings in the AOT publish."
            exit 1
          fi

      - name: The native binary serves a request
        # Publishing proves it links. This proves it runs: a trim-related failure that
        # the analyzer misses shows up at startup or on the first request, and a build
        # that only checks for IL warnings would report success anyway.
        run: |
          BIN=samples/ecommerce/bin/Release/net10.0/linux-x64/publish/Ecommerce
          ASPNETCORE_URLS=http://127.0.0.1:5210 "$BIN" &
          APP=$!
          trap 'kill $APP 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:5210/health >/dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:5210/health >/dev/null || {
            echo "::error::The native binary did not become healthy."; exit 1; }

          BODY=$(curl -sf -X POST http://127.0.0.1:5210/api/v1/orders \
            -H 'Content-Type: application/json' \
            -H 'Idempotency-Key: ci-smoke' \
            -d '{"sku":"SKU-1","quantity":1,"paymentToken":"tok"}') || {
            echo "::error::The native binary refused a valid order."; exit 1; }

          echo "$BODY"
          echo "$BODY" | grep -q '"receiptId"' || {
            echo "::error::The response did not carry the flow's declared output."; exit 1; }

  manifest:
    name: Manifest compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: The sample's manifest must stay compatible with its committed baseline
        # ADR-0005 makes the manifest a build artifact so it can be COMPARED. Until
        # something compares two of them the artifact is a description nobody acts on,
        # so this is the step that gives it teeth.
        #
        # The baseline is committed on purpose. A contract change then arrives as a
        # reviewable diff of samples/ecommerce/flowx.manifest.baseline.json rather than
        # as a number in a log, which is the same reasoning the benchmark baseline uses.
        # Regenerate it deliberately when the change is intended:
        #
        #   dotnet run --project src/FlowX.Cli -- manifest \
        #     --assembly samples/ecommerce/bin/Release/net10.0/Ecommerce.dll \
        #     --output samples/ecommerce/flowx.manifest.baseline.json
        run: |
          dotnet build samples/ecommerce/Ecommerce.csproj --configuration Release
          dotnet run --project src/FlowX.Cli --configuration Release --no-build -- manifest \
            --assembly samples/ecommerce/bin/Release/net10.0/Ecommerce.dll \
            --output "$RUNNER_TEMP/candidate.manifest.json"

          # No `if` and no wrapper: flowx diff exits 1 on a breaking change, and that
          # exit code is the gate.
          dotnet run --project src/FlowX.Cli --configuration Release --no-build -- diff \
            --old samples/ecommerce/flowx.manifest.baseline.json \
            --new "$RUNNER_TEMP/candidate.manifest.json"

  docs:
    name: Documentation gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # the flow-graph step below runs the CLI

      - name: Mermaid diagrams parse
        # 70+ diagrams across docs/ and samples/. A diagram that does not render is a
        # broken document, and GitHub gives no error when one fails silently.
        run: |
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox"]}' > /tmp/pptr.json
          fail=0
          while IFS= read -r file; do
            python3 - "$file" <<'PY' > /tmp/blocks.txt
          import re, sys
          text = open(sys.argv[1]).read()
          for i, m in enumerate(re.finditer(r'```mermaid\n(.*?)```', text, re.S), 1):
              open(f'/tmp/block{i}.mmd', 'w').write(m.group(1))
              print(f'/tmp/block{i}.mmd')
          PY
            while IFS= read -r block; do
              mmdc -i "$block" -o /tmp/out.svg -p /tmp/pptr.json >/dev/null 2>&1 \
                || { echo "::error file=$file::mermaid diagram failed to parse"; fail=1; }
            done < /tmp/blocks.txt
          done < <(find docs samples -name '*.md')
          exit $fail

      - name: Rendered flow graph parses
        # WP-9's exit criterion. The renderer's unit tests check structure — every edge
        # references a declared node, every subgraph is closed — but only a real Mermaid
        # parser proves the file renders. A diagram that silently fails to render is the
        # failure mode a human eye skims past.
        run: |
          dotnet build src/FlowX.Cli --configuration Release
          dotnet run --configuration Release --project src/FlowX.Cli -- \
            graph --manifest tests/FlowX.Cli.Tests/fixtures/sample.manifest.json \
            --output /tmp/graph.mmd
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox"]}' > /tmp/pptr.json
          mmdc -i /tmp/graph.mmd -o /tmp/graph.svg -p /tmp/pptr.json
          test -s /tmp/graph.svg || { echo "::error::mmdc produced no output."; exit 1; }

      - name: Internal links resolve
        run: |
          python3 - <<'PY'
          import os, re, sys
          bad = []
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(root, f)
                  for m in re.finditer(r'\[[^\]]*\]\(([^)]+)\)', open(p).read()):
                      link = m.group(1)
                      if link.startswith(('http', '#', 'mailto')):
                          continue
                      target = link.split('#')[0]
                      if target and not os.path.exists(os.path.normpath(os.path.join(root, target))):
                          bad.append(f'{p} -> {link}')
          for b in bad:
              print(f'::error::broken link {b}')
          sys.exit(1 if bad else 0)
          PY

  attribution:
    name: Attribution guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No bot authorship in history
        # Repository owner's standing requirement: commits are authored by people.
        #
        # Scoped to HEAD, not `--all`. `--all` was a live failure, not a hypothetical:
        # `fetch-depth: 0` pulls down every remote branch, including the open
        # `dependabot/*` pull-request branches this repository asks for in
        # .github/dependabot.yml — six of them today, each authored by `dependabot[bot]`
        # and so each matching the pattern below. The job therefore failed on every push
        # to dev and master for commits that are not part of this repository's history,
        # were not written by the author of the change under test, and could not be
        # remediated by them.
        #
        # This is a narrowing of blast radius, not of the rule: every commit that has
        # ever landed is still reachable from HEAD and still audited, and a bot-authored
        # commit inside the change under test is still caught. What is no longer audited
        # is somebody else's unmerged branch.
        run: |
          if git log HEAD --pretty=format:'%an|%ae|%cn|%ce' | grep -iE 'noreply@anthropic|\[bot\]'; then
            echo "::error::A commit is authored by a bot identity."
            exit 1
          fi
          echo "History is clean."
